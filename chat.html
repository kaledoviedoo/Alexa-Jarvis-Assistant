<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161615">
<title>Jarvis</title>
<style>
:root {
  color-scheme: light dark;
  --fondo: #f6f5f2;
  --panel: #ffffff;
  --texto: #1d1d1b;
  --suave: #6b6a66;
  --tenue: #9a988f;
  --borde: #e2e0d9;
  --acento: #2f6f5e;
  --acento-texto: #ffffff;
  --yo: #e6efe9;
  --freno: #9a5b00;
  --freno-fondo: #fdf3e2;
  --mal: #b4342b;
  --mal-fondo: #fbeceb;
  --bien: #2f7a45;
  --codigo: #f0efea;
  --sombra: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #161615;
    --panel: #1e1e1c;
    --texto: #ecebe7;
    --suave: #a3a19b;
    --tenue: #75736d;
    --borde: #33322f;
    --acento: #6fc2a9;
    --acento-texto: #10201b;
    --yo: #23332d;
    --freno: #f0b65a;
    --freno-fondo: #2d2414;
    --mal: #f08a80;
    --mal-fondo: #331c1a;
    --bien: #7fcf95;
    --codigo: #262624;
    --sombra: none;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--fondo); color: var(--texto);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column;
}
header {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--borde); background: var(--panel);
  position: sticky; top: 0; z-index: 2;
}
header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
#estado { font-size: 13px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.boton-sec {
  border: 1px solid var(--borde); background: transparent; color: var(--texto);
  border-radius: 8px; padding: 6px 10px; font: 500 13px system-ui; cursor: pointer; white-space: nowrap;
}
.boton-sec:hover { border-color: var(--suave); }
main { flex: 1; overflow-y: auto; padding: 16px; }
#conversacion { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.vacio { color: var(--suave); text-align: center; margin-top: 18vh; }
.vacio b { color: var(--texto); }
.yo {
  align-self: flex-end; max-width: 85%; background: var(--yo); padding: 9px 13px;
  border-radius: 14px 14px 4px 14px; white-space: pre-wrap; word-wrap: break-word;
}
.jarvis { align-self: stretch; max-width: 100%; }
.respuesta { white-space: pre-wrap; word-wrap: break-word; }
.meta { font-size: 12px; color: var(--tenue); margin-top: 4px; }
.pensando { color: var(--suave); font-size: 14px; display: flex; align-items: center; gap: 8px; }
.punto { width: 7px; height: 7px; border-radius: 50%; background: var(--acento); animation: latir 1s infinite ease-in-out; }
@keyframes latir { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .punto { animation: none; } }
details.pasos { margin: 6px 0 8px; border-left: 2px solid var(--borde); padding-left: 10px; }
details.pasos > summary { cursor: pointer; font-size: 13px; color: var(--suave); list-style: none; }
details.pasos > summary::-webkit-details-marker { display: none; }
details.pasos > summary::before { content: "▸ "; }
details.pasos[open] > summary::before { content: "▾ "; }
.linea { font-size: 13px; color: var(--suave); margin: 4px 0; word-wrap: break-word; }
.linea.freno { color: var(--freno); background: var(--freno-fondo); padding: 4px 8px; border-radius: 6px; }
.linea.verificacion { color: var(--mal); background: var(--mal-fondo); padding: 4px 8px; border-radius: 6px; }
.linea.insiste { color: var(--freno); }
.linea.router { color: var(--acento); }
.paso {
  font-size: 13px; margin: 6px 0; padding: 7px 9px; border: 1px solid var(--borde);
  border-radius: 8px; background: var(--panel); box-shadow: var(--sombra);
}
.paso .nombre { font-weight: 600; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
.paso .args { color: var(--suave); font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; }
.paso .res { margin-top: 4px; white-space: pre-wrap; word-wrap: break-word; max-height: 9.5em; overflow: auto; }
.paso.vetado { border-color: var(--freno); }
.paso.fallo { border-color: var(--mal); }
.etiqueta { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 5px; margin-left: 6px; }
.etiqueta.ok { color: var(--bien); border: 1px solid currentColor; }
.etiqueta.no { color: var(--mal); border: 1px solid currentColor; }
.etiqueta.freno { color: var(--freno); border: 1px solid currentColor; }
.confirmar {
  margin-top: 8px; padding: 10px 12px; border: 1px solid var(--acento); border-radius: 10px;
  background: var(--panel); display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
}
.confirmar .q { flex: 1 1 200px; font-size: 14px; }
.confirmar button { border: 0; border-radius: 8px; padding: 8px 16px; font: 600 14px system-ui; cursor: pointer; }
.si { background: var(--acento); color: var(--acento-texto); }
.no { background: transparent; color: var(--texto); border: 1px solid var(--borde) !important; }
.cuenta { font-size: 12px; color: var(--tenue); font-variant-numeric: tabular-nums; }
.fondo { margin-top: 8px; font-size: 14px; padding: 8px 10px; border-radius: 8px; background: var(--codigo); }
.fondo .res { white-space: pre-wrap; margin-top: 4px; }
.error { color: var(--mal); }
footer {
  border-top: 1px solid var(--borde); background: var(--panel);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
}
#atajos { max-width: 760px; margin: 0 auto 8px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
#atajos::-webkit-scrollbar { display: none; }
#atajos button {
  flex: none; border: 1px solid var(--borde); background: transparent; color: var(--suave);
  border-radius: 999px; padding: 5px 11px; font: 13px system-ui; cursor: pointer;
}
#atajos button:hover { color: var(--texto); border-color: var(--suave); }
form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
textarea {
  flex: 1; resize: none; min-height: 44px; max-height: 160px; padding: 10px 12px;
  border: 1px solid var(--borde); border-radius: 12px; background: var(--fondo); color: inherit;
  font: inherit; line-height: 1.4;
}
textarea:focus { outline: 2px solid var(--acento); outline-offset: -1px; border-color: transparent; }
#enviar {
  height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--acento);
  color: var(--acento-texto); font: 600 15px system-ui; cursor: pointer;
}
#enviar:disabled { opacity: .5; cursor: default; }
dialog {
  border: 1px solid var(--borde); border-radius: 14px; background: var(--panel); color: var(--texto);
  padding: 20px; max-width: min(440px, calc(100vw - 32px)); width: 100%;
}
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog h2 { margin: 0 0 8px; font-size: 18px; }
dialog p { margin: 0 0 12px; color: var(--suave); font-size: 14px; }
.codigo-grande { font: 700 40px/1 ui-monospace, Consolas, monospace; letter-spacing: .25em; text-align: center; margin: 14px 0; }
.direccion { font-family: ui-monospace, Consolas, monospace; font-size: 15px; background: var(--codigo); padding: 8px 10px; border-radius: 8px; word-break: break-all; }
.tarea { padding: 8px 0; border-top: 1px solid var(--borde); font-size: 14px; }
.tarea:first-child { border-top: 0; }
.tarea .cab { display: flex; justify-content: space-between; gap: 8px; }
.tarea .est { font-size: 12px; color: var(--tenue); white-space: nowrap; }
.tarea .txt { color: var(--suave); font-size: 13px; margin-top: 2px; }
.dlg-pie { display: flex; justify-content: flex-end; margin-top: 14px; }
@media (max-width: 520px) {
  header { padding: 8px 12px; }
  main { padding: 12px; }
  footer { padding-left: 12px; padding-right: 12px; }
  .yo { max-width: 92%; }
  #estado { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>Jarvis</h1>
  <div id="estado">conectando…</div>
  <button class="boton-sec" id="btn-tareas" type="button">Tareas</button>
  <button class="boton-sec" id="btn-vincular" type="button" hidden>Vincular celular</button>
</header>

<main id="scroll">
  <div id="conversacion">
    <div class="vacio" id="vacio">Escríbele como le hablas al Echo.<br>Aquí <b>no hay límite de 8 segundos</b> y ves cada paso que da.</div>
  </div>
</main>

<footer>
  <div id="atajos"></div>
  <form id="formulario" autocomplete="off">
    <textarea id="entrada" rows="1" placeholder="Pídele algo a Jarvis…" aria-label="Orden para Jarvis"></textarea>
    <button id="enviar" type="submit">Enviar</button>
  </form>
</footer>

<dialog id="dlg-vincular">
  <h2>Vincular el celular</h2>
  <p>Con Tailscale abierto en el celular, entra a esta dirección y escribe el código. Vale 5 minutos y una sola vez.</p>
  <div class="direccion" id="v-direccion">…</div>
  <div class="codigo-grande" id="v-codigo">······</div>
  <p class="cuenta" id="v-cuenta"></p>
  <div class="dlg-pie"><button class="boton-sec" type="button" data-cerrar>Cerrar</button></div>
</dialog>

<dialog id="dlg-tareas">
  <h2>Tareas recientes</h2>
  <div id="lista-tareas"></div>
  <div class="dlg-pie"><button class="boton-sec" type="button" data-cerrar>Cerrar</button></div>
</dialog>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const conversacion = $("#conversacion");
const scroll = $("#scroll");
const entrada = $("#entrada");
const enviar = $("#enviar");

const ATAJOS = ["cómo quedó lo último", "qué ventanas tengo abiertas", "cómo está el equipo",
                "qué rutinas tengo", "en qué modo estás", "pon el modo dedicado", "pon el modo normal"];
for (const a of ATAJOS) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = a;
  b.onclick = () => mandar(a);
  $("#atajos").append(b);
}

function el(tag, clase, texto) {
  const e = document.createElement(tag);
  if (clase) e.className = clase;
  if (texto !== undefined) e.textContent = texto;
  return e;
}

function abajo() { scroll.scrollTop = scroll.scrollHeight; }

async function api(ruta, opciones = {}) {
  const r = await fetch(ruta, {
    ...opciones,
    headers: { "Content-Type": "application/json", "X-Jarvis-Chat": "1", ...(opciones.headers || {}) },
    credentials: "same-origin",
  });
  if (r.status === 401) { location.href = "/chat"; throw new Error("sin vincular"); }
  if (!r.ok) throw new Error(`${r.status}`);
  return r.json();
}

function corto(obj) {
  try {
    const t = JSON.stringify(obj);
    return t === "{}" ? "" : (t.length > 220 ? t.slice(0, 220) + "…" : t);
  } catch { return ""; }
}

const ORIGEN = { router: "router", modelo: "modelo", semantica: "capa semántica" };

function nuevaRespuesta(texto) {
  $("#vacio")?.remove();
  conversacion.append(el("div", "yo", texto));
  const caja = el("div", "jarvis");
  const pasos = el("details", "pasos");
  pasos.open = true;
  const resumen = el("summary", "", "Pasos");
  pasos.append(resumen);
  pasos.hidden = true;
  const pensando = el("div", "pensando");
  pensando.append(el("span", "punto"), el("span", "", "Pensando…"));
  caja.append(pasos, pensando);
  conversacion.append(caja);
  abajo();
  return { caja, pasos, resumen, pensando, nPasos: 0, ultimoEjecutando: null };
}

function anotar(v, ev) {
  if (ev.tipo === "log") {
    if (ev.clase === "ejecutando") {
      v.pensando.lastChild.textContent = ev.mensaje.replace("Ejecutando herramienta ", "Usando ").split(" con ")[0] + "…";
      return;
    }
    if (ev.clase === "info" && !/varios pasos|delegando|segundo plano|Presupuesto/i.test(ev.mensaje)) return;
    let texto = ev.mensaje;
    if (ev.clase === "ofrecidas") texto = texto.split(":")[0] + ".";
    if (ev.clase === "freno") {
      const m = texto.match(/^FRENO: (\w+)[^.]*\.\s*(?:No ejecuto \w+:\s*)?([^.]*)/);
      if (m) texto = `Frenado ${m[1]}: ${m[2]}.`;
    }
    v.pasos.hidden = false;
    v.pasos.append(el("div", "linea " + ev.clase, texto));
  } else if (ev.tipo === "paso") {
    v.nPasos++;
    v.pasos.hidden = false;
    const r = ev.resultado || "";
    const vetado = r.startsWith("No ejecuto") || r.startsWith("No usé");
    const fallo = r.includes("VERIFICACION FALLIDA");
    const p = el("div", "paso" + (vetado ? " vetado" : fallo ? " fallo" : ""));
    const cab = el("div");
    cab.append(el("span", "nombre", ev.herramienta));
    if (vetado) cab.append(el("span", "etiqueta freno", "frenado"));
    else if (fallo) cab.append(el("span", "etiqueta no", "no se comprobó"));
    p.append(cab);
    const args = corto(ev.argumentos);
    if (args) p.append(el("div", "args", args));
    p.append(el("div", "res", r.replace(/\nVERIFICACION FALLIDA:[\s\S]*/, "\n⚠ La comprobación falló.")));
    v.pasos.append(p);
    v.resumen.textContent = `Pasos (${v.nPasos})`;
    v.pensando.lastChild.textContent = "Pensando…";
  } else if (ev.tipo === "respuesta" || ev.tipo === "error") {
    v.pensando.remove();
    v.caja.append(el("div", "respuesta" + (ev.tipo === "error" ? " error" : ""), ev.texto));
    if (ev.tipo === "respuesta") {
      const quien = ORIGEN[ev.origen] || ev.origen;
      v.caja.append(el("div", "meta", `${quien} · ${(ev.ms / 1000).toFixed(1)} s`));
      if (v.nPasos === 0 && v.pasos.childElementCount <= 1) v.pasos.remove();
      else v.pasos.open = false;
      if (ev.confirmacion) confirmar(v.caja, ev.confirmacion);
    }
  } else if (ev.tipo === "fondo") {
    const f = el("div", "fondo");
    f.dataset.desc = ev.descripcion;
    const linea = el("div", "pensando");
    linea.append(el("span", "punto"), el("span", "", `Sigue al fondo: ${ev.descripcion}`));
    f.append(linea);
    v.caja.append(f);
  } else if (ev.tipo === "fondo_hecho") {
    const f = [...v.caja.querySelectorAll(".fondo")].find((x) => x.dataset.desc === ev.descripcion);
    const destino = f || v.caja.appendChild(el("div", "fondo"));
    destino.replaceChildren(el("div", "meta", `Terminó: ${ev.descripcion}`), el("div", "res", ev.resultado));
  }
  abajo();
}

function confirmar(caja, c) {
  const box = el("div", "confirmar");
  box.append(el("div", "q", `¿Confirmas que quieres ${c.descripcion}?`));
  const si = el("button", "si", "Sí, hazlo");
  const no = el("button", "no", "No");
  const cuenta = el("span", "cuenta");
  box.append(si, no, cuenta);
  caja.append(box);
  let quedan = Math.max(0, Math.floor(c.segundos));
  const reloj = setInterval(() => {
    cuenta.textContent = `${quedan} s`;
    if (quedan-- <= 0) { clearInterval(reloj); box.replaceChildren(el("div", "meta", "La confirmación caducó.")); }
  }, 1000);
  const responder = (t) => { clearInterval(reloj); box.remove(); mandar(t); };
  si.onclick = () => responder("sí");
  no.onclick = () => responder("no");
}

let ocupados = 0;
async function mandar(texto) {
  texto = (texto || "").trim();
  if (!texto) return;
  const v = nuevaRespuesta(texto);
  ocupados++;
  try {
    const { id } = await api("/chat/orden", { method: "POST", body: JSON.stringify({ texto }) });
    let desde = 0, terminado = false, fallosRed = 0;
    while (!terminado) {
      try {
        const r = await api(`/chat/eventos/${id}?desde=${desde}`);
        fallosRed = 0;
        for (const ev of r.eventos) anotar(v, ev);
        desde = r.siguiente;
        terminado = r.terminado;
      } catch (e) {
        if (++fallosRed > 8) throw e;
        await new Promise((ok) => setTimeout(ok, 1500));
      }
    }
  } catch (e) {
    v.pensando.remove();
    v.caja.append(el("div", "respuesta error", `No pude hablar con Jarvis (${e.message}). ¿Está encendido?`));
  } finally {
    ocupados--;
    refrescarEstado();
  }
}

$("#formulario").onsubmit = (e) => {
  e.preventDefault();
  const t = entrada.value;
  entrada.value = "";
  ajustar();
  mandar(t);
};
entrada.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#formulario").requestSubmit(); }
});
function ajustar() { entrada.style.height = "auto"; entrada.style.height = Math.min(entrada.scrollHeight, 160) + "px"; }
entrada.addEventListener("input", ajustar);

let estadoActual = null;
async function refrescarEstado() {
  try {
    const s = await api("/chat/estado");
    estadoActual = s;
    $("#estado").textContent = `modo ${s.modo} · ${s.modelo}`;
    $("#btn-vincular").hidden = s.lugar !== "local";
  } catch {
    $("#estado").textContent = "sin conexión";
  }
}

function mostrarTareas() {
  const lista = $("#lista-tareas");
  lista.replaceChildren();
  const ts = (estadoActual && estadoActual.tareas) || [];
  if (!ts.length) lista.append(el("p", "", "Todavía no hay tareas."));
  const NOMBRES = { hecha: "hecha", fallo: "falló", corriendo: "en curso", interrumpida: "a medias", en_cola: "en cola" };
  for (const t of ts) {
    const d = el("div", "tarea");
    const cab = el("div", "cab");
    cab.append(el("span", "", t.descripcion), el("span", "est", `${NOMBRES[t.estado] || t.estado} · ${t.inicio.slice(11, 16)}`));
    d.append(cab);
    if (t.resultado) d.append(el("div", "txt", t.resultado));
    lista.append(d);
  }
}

$("#btn-tareas").onclick = async () => { await refrescarEstado(); mostrarTareas(); $("#dlg-tareas").showModal(); };

let relojCodigo = null;
$("#btn-vincular").onclick = async () => {
  const dlg = $("#dlg-vincular");
  try {
    const r = await api("/chat/codigo", { method: "POST" });
    $("#v-codigo").textContent = r.codigo;
    $("#v-direccion").textContent = r.direccion || "No encontré la IP de Tailscale. ¿Está abierto en el PC?";
    let quedan = r.segundos;
    clearInterval(relojCodigo);
    const tic = () => {
      const m = Math.floor(quedan / 60), s = quedan % 60;
      $("#v-cuenta").textContent = quedan > 0 ? `Caduca en ${m}:${String(s).padStart(2, "0")}` : "Caducó. Ciérralo y pide otro.";
      if (quedan-- <= 0) clearInterval(relojCodigo);
    };
    tic(); relojCodigo = setInterval(tic, 1000);
    dlg.showModal();
  } catch (e) {
    alert("No pude pedir el código: " + e.message);
  }
};

document.querySelectorAll("[data-cerrar]").forEach((b) => (b.onclick = () => b.closest("dialog").close()));

(async () => {
  await refrescarEstado();
  const previas = (estadoActual && estadoActual.conversacion) || [];
  for (const c of previas) {
    if (!c.terminado || !c.respuesta) continue;
    $("#vacio")?.remove();
    conversacion.append(el("div", "yo", c.texto));
    const caja = el("div", "jarvis");
    caja.append(el("div", "respuesta", c.respuesta));
    conversacion.append(caja);
  }
  abajo();
  entrada.focus();
  setInterval(() => { if (!ocupados) refrescarEstado(); }, 30000);
})();
</script>
</body>
</html>
