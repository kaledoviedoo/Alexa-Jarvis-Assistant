<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<title>Jarvis</title>
<style>
:root {
  color-scheme: dark;
  --fondo: #0e0e0f;
  --marco: #151516;
  --panel: #1b1b1d;
  --panel-2: #222225;
  --borde: #262629;
  --borde-fuerte: #34343a;
  --texto: #ededee;
  --suave: #a1a1a7;
  --tenue: #6b6b72;
  --acento: #6d4aff;
  --acento-claro: #a594ff;
  --acento-tinte: rgba(109, 74, 255, .14);
  --freno: #f5b45a;
  --freno-fondo: rgba(245, 180, 90, .08);
  --mal: #f38b82;
  --mal-fondo: rgba(243, 139, 130, .08);
  --bien: #7dd69a;
  --azul: #4f8dff;
  --rojo: #ff5a6e;
  --naranja: #ff9f43;
  --morado: #8b6cff;
  --rosa: #ff6fae;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--fondo); color: var(--texto);
  font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; }
svg { display: block; flex: none; }

/* ---------- Barra superior ---------- */
.barra {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 12px 24px; gap: 12px; flex: none;
}
.marca { font-size: 21px; font-weight: 600; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
.centro { display: flex; align-items: center; gap: 4px; }
.nav {
  display: flex; align-items: center; gap: 7px; border: 1px solid transparent; background: transparent;
  color: var(--suave); border-radius: 999px; padding: 7px 13px; cursor: pointer; font-size: 13.5px; white-space: nowrap;
}
.nav:hover { color: var(--texto); background: var(--panel); }
.nav.marcado { border-color: var(--borde-fuerte); color: var(--texto); background: var(--panel); }
.derecha { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
#estado {
  font-size: 12.5px; color: var(--suave); border: 1px solid var(--borde); background: var(--marco);
  border-radius: 999px; padding: 5px 12px; white-space: nowrap; display: flex; align-items: center; gap: 7px;
}
#estado { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
#estado::before { content: ""; width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--bien); }
@media (max-width: 1180px) { #btn-vincular span { display: none; } #estado { max-width: 150px; } }
#estado.sin::before { background: var(--mal); }
#abrir-menu { display: none; }
.icono {
  width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: transparent;
  border-radius: 10px; color: var(--suave); cursor: pointer;
}
.icono:hover { background: var(--panel); color: var(--texto); }

/* ---------- Marco central ---------- */
.marco {
  flex: 1; min-height: 0; margin: 0 16px 16px; background: var(--marco); border: 1px solid var(--borde);
  border-radius: 22px; display: flex; flex-direction: column; overflow: hidden; position: relative;
}
#zona { flex: 1; overflow-y: auto; padding: 0 24px; scrollbar-width: thin; scrollbar-color: var(--borde-fuerte) transparent; }
.columna { max-width: 800px; margin: 0 auto; }
#pie { flex: none; padding: 10px 24px 22px; }

.marco.inicio #zona { display: flex; flex-direction: column; justify-content: center; }
.marco:not(.inicio) #bienvenida, .marco:not(.inicio) .sugerencias { display: none; }
.marco.inicio #conversacion { display: none; }

#bienvenida { text-align: center; padding: 24px 0 8px; max-width: 900px; }
#bienvenida h1 { margin: 0; font-size: clamp(28px, 4.2vw, 42px); font-weight: 600; letter-spacing: -.03em; line-height: 1.15; }
#bienvenida h1 .nombre { color: #8c8c93; }
#bienvenida p { margin: 10px auto 0; color: var(--suave); max-width: 420px; }

.categorias { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 34px auto 0; text-align: left; }
.cat {
  background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 12px 13px;
  cursor: pointer; text-align: left; transition: border-color .15s, background .15s;
}
.cat:hover { border-color: var(--borde-fuerte); background: var(--panel-2); }
.cat .ic { width: 20px; height: 20px; margin-bottom: 10px; }
.cat b { display: block; font-size: 14px; font-weight: 600; }
.cat small { display: block; font-size: 12px; color: var(--tenue); margin-top: 2px; line-height: 1.4; }
.c-azul { color: var(--azul); } .c-rojo { color: var(--rojo); } .c-naranja { color: var(--naranja); }
.c-morado { color: var(--morado); } .c-rosa { color: var(--rosa); }

/* Caja de escribir */
.caja { background: var(--fondo); border: 1px solid var(--borde-fuerte); border-radius: 16px; padding: 12px 12px 10px 14px; }
.caja:focus-within { border-color: #4a4a52; }
textarea {
  width: 100%; resize: none; border: 0; outline: none; background: transparent; color: var(--texto);
  font: inherit; font-size: 15px; line-height: 1.45; min-height: 44px; max-height: 180px; padding: 2px 2px 6px;
}
textarea::placeholder { color: var(--tenue); }
.caja-pie { display: flex; align-items: center; gap: 6px; }
.caja-pie .espacio { flex: 1; }
.cuadro {
  width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; cursor: pointer;
  background: var(--panel); border: 1px solid var(--borde); color: var(--suave); position: relative;
}
.cuadro:hover { color: var(--texto); border-color: var(--borde-fuerte); }
.cuadro.activo { color: var(--acento-claro); border-color: var(--acento); background: var(--acento-tinte); }
.cuadro.grabando { color: #fff; background: #ef4444; border-color: #ef4444; animation: grabando 1.2s ease-in-out infinite; }
@keyframes grabando { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.5) } 50% { box-shadow: 0 0 0 7px rgba(239,68,68,0) } }
#principal {
  height: 34px; padding: 0 15px; border-radius: 9px; border: 0; cursor: pointer; display: flex; align-items: center; gap: 7px;
  background: var(--acento); color: #fff; font-weight: 600; font-size: 13.5px;
}
#principal:hover { background: #7c5cff; }
#principal:disabled { opacity: .45; cursor: default; }
#principal.grabando { background: #ef4444; }
.aviso-voz { font-size: 12.5px; color: var(--tenue); margin: 7px 4px 0; min-height: 1.2em; }

.sugerencias { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.sug {
  display: flex; align-items: center; gap: 7px; border: 1px solid var(--borde); background: transparent;
  color: var(--suave); border-radius: 9px; padding: 6px 10px; font-size: 12.5px; cursor: pointer;
}
.sug:hover { color: var(--texto); border-color: var(--borde-fuerte); }

/* Menus */
.menu {
  position: absolute; bottom: 46px; right: 0; background: var(--panel-2); border: 1px solid var(--borde-fuerte);
  border-radius: 12px; padding: 6px; min-width: 210px; z-index: 6; box-shadow: 0 12px 40px rgba(0,0,0,.45);
}
.menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
.menu button:hover { background: var(--panel); }
.menu small { display: block; color: var(--tenue); font-size: 12px; }
.menu hr { border: 0; border-top: 1px solid var(--borde); margin: 4px 2px; }
.ancla { position: relative; }
#menu-movil { display: none; }
#menu-movil.abierto { display: block; position: fixed; top: 54px; left: 12px; bottom: auto; right: auto; z-index: 9; }

/* Conversacion */
#conversacion { display: flex; flex-direction: column; gap: 18px; padding: 24px 0 16px; }
.yo {
  align-self: flex-end; max-width: 78%; background: var(--panel-2); border: 1px solid var(--borde);
  padding: 9px 14px; border-radius: 16px 16px 5px 16px; white-space: pre-wrap; word-wrap: break-word;
}
.jarvis { display: flex; gap: 12px; align-items: flex-start; }
.jarvis .marca-j {
  width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center; margin-top: 1px;
  background: var(--acento-tinte); color: var(--acento-claro); border: 1px solid rgba(109,74,255,.35);
}
.jarvis .cuerpo { flex: 1; min-width: 0; }
.respuesta { white-space: pre-wrap; word-wrap: break-word; }
.meta { font-size: 12px; color: var(--tenue); margin-top: 6px; }
.fecha-sep { text-align: center; font-size: 12px; color: var(--tenue); }
.pensando { color: var(--suave); font-size: 14px; display: flex; align-items: center; gap: 8px; min-height: 28px; }
.punto { width: 7px; height: 7px; border-radius: 50%; background: var(--acento-claro); animation: pulso 1s infinite ease-in-out; }
@keyframes pulso { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .punto, .cuadro.grabando { animation: none; } }
details.pasos { margin: 2px 0 10px; border: 1px solid var(--borde); border-radius: 12px; background: var(--panel); padding: 8px 12px; }
details.pasos > summary { cursor: pointer; font-size: 13px; color: var(--suave); list-style: none; display: flex; align-items: center; gap: 7px; }
details.pasos > summary::-webkit-details-marker { display: none; }
details.pasos > summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
details.pasos[open] > summary::before { transform: rotate(45deg); }
details.pasos[open] > summary { margin-bottom: 6px; }
.linea { font-size: 13px; color: var(--tenue); margin: 4px 0; word-wrap: break-word; }
.linea.freno { color: var(--freno); background: var(--freno-fondo); padding: 5px 9px; border-radius: 8px; }
.linea.verificacion { color: var(--mal); background: var(--mal-fondo); padding: 5px 9px; border-radius: 8px; }
.linea.insiste { color: var(--freno); }
.linea.router { color: var(--acento-claro); }
.paso { font-size: 13px; margin: 8px 0; padding: 9px 11px; border: 1px solid var(--borde); border-radius: 10px; background: var(--fondo); }
.paso .nombre { font-weight: 600; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; color: var(--acento-claro); }
.paso .args { color: var(--tenue); font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; margin-top: 2px; }
.paso .res { margin-top: 5px; white-space: pre-wrap; word-wrap: break-word; max-height: 10em; overflow: auto; color: var(--suave); }
.paso.vetado { border-color: rgba(245, 180, 90, .45); }
.paso.fallo { border-color: rgba(243, 139, 130, .5); }
.etiqueta { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; margin-left: 8px; border: 1px solid currentColor; }
.etiqueta.no { color: var(--mal); }
.etiqueta.freno { color: var(--freno); }
.confirmar {
  margin-top: 10px; padding: 11px 13px; border: 1px solid rgba(109, 74, 255, .55); border-radius: 12px;
  background: var(--acento-tinte); display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
}
.confirmar .q { flex: 1 1 220px; font-size: 14px; }
.confirmar button { border: 0; border-radius: 9px; padding: 7px 16px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
.confirmar .si { background: var(--acento); color: #fff; }
.confirmar .no { background: transparent; border: 1px solid var(--borde-fuerte); }
.cuenta { font-size: 12px; color: var(--tenue); font-variant-numeric: tabular-nums; }
.fondo { margin-top: 10px; font-size: 14px; padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--borde); }
.fondo .res { white-space: pre-wrap; margin-top: 4px; }
.error { color: var(--mal); }

/* ---------- Historial (panel lateral) ---------- */
#historial-panel {
  position: fixed; inset: 0 auto 0 0; width: min(340px, 88vw); background: var(--marco); border-right: 1px solid var(--borde);
  transform: translateX(-102%); transition: transform .2s ease; z-index: 8; display: flex; flex-direction: column;
  padding: 16px 14px; gap: 12px; box-shadow: 24px 0 60px rgba(0,0,0,.5);
}
#historial-panel.abierto { transform: none; }
#velo { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 7; }
#velo.visible { display: block; }
.h-cab { display: flex; align-items: center; justify-content: space-between; }
.h-cab h2 { margin: 0; font-size: 16px; font-weight: 600; }
.buscar {
  display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--borde);
  border-radius: 10px; padding: 0 12px; height: 38px; color: var(--tenue);
}
.buscar:focus-within { border-color: var(--borde-fuerte); }
.buscar input { flex: 1; border: 0; background: transparent; color: var(--texto); font: inherit; outline: none; min-width: 0; }
#historial { flex: 1; overflow-y: auto; margin: 0 -6px; padding: 0 6px; scrollbar-width: thin; scrollbar-color: var(--borde) transparent; }
.grupo { margin: 6px 0 14px; }
.grupo h3 { font-size: 12px; font-weight: 600; color: var(--tenue); margin: 0 0 6px 6px; text-transform: uppercase; letter-spacing: .04em; }
.item { display: flex; align-items: center; gap: 6px; border-radius: 10px; padding: 0 4px 0 10px; height: 36px; cursor: pointer; }
.item:hover { background: var(--panel); }
.item.activo { background: var(--acento-tinte); }
.item .t { flex: 1; font-size: 13.5px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item:hover .t, .item.activo .t { color: var(--texto); }
.item .mas { width: 28px; height: 28px; border: 0; background: transparent; color: var(--tenue); border-radius: 8px; cursor: pointer; opacity: 0; }
.item:hover .mas, .item.activo .mas { opacity: 1; }
@media (hover: none) { .item .mas { opacity: 1; } }
.item .mas:hover { color: var(--texto); background: var(--panel-2); }
.item.borrar { background: var(--mal-fondo); }
.item.borrar .t { color: var(--mal); }
.item.borrar button { border: 0; background: transparent; cursor: pointer; font-size: 12.5px; padding: 4px 8px; border-radius: 8px; opacity: 1; }
.item.borrar .si { color: var(--mal); font-weight: 600; }
.lat-vacio { color: var(--tenue); font-size: 13px; padding: 4px 6px; }

/* Dialogos */
dialog {
  border: 1px solid var(--borde-fuerte); border-radius: 18px; background: var(--marco); color: var(--texto);
  padding: 22px; max-width: min(460px, calc(100vw - 32px)); width: 100%;
}
dialog::backdrop { background: rgba(0, 0, 0, .6); }
dialog h2 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
dialog p { margin: 0 0 12px; color: var(--suave); font-size: 14px; }
.codigo-grande { font: 700 42px/1 ui-monospace, Consolas, monospace; letter-spacing: .25em; text-align: center; margin: 16px 0; color: var(--acento-claro); }
.direccion { font-family: ui-monospace, Consolas, monospace; font-size: 14.5px; background: var(--fondo); border: 1px solid var(--borde); padding: 9px 12px; border-radius: 10px; word-break: break-all; }
.tarea { padding: 10px 0; border-top: 1px solid var(--borde); font-size: 14px; }
.tarea:first-child { border-top: 0; }
.tarea .cab { display: flex; justify-content: space-between; gap: 10px; }
.tarea .est { font-size: 12px; color: var(--tenue); white-space: nowrap; }
.tarea .txt { color: var(--suave); font-size: 13px; margin-top: 3px; }
#lista-tareas { max-height: 60vh; overflow-y: auto; }
.dlg-pie { display: flex; justify-content: flex-end; margin-top: 16px; }
.boton-sec { border: 1px solid var(--borde-fuerte); background: transparent; border-radius: 9px; padding: 7px 16px; cursor: pointer; }
.boton-sec:hover { border-color: var(--acento); }

/* ---------- Celular ---------- */
@media (max-width: 900px) {
  .barra { grid-template-columns: auto 1fr auto; padding: 10px 14px; }
  .centro { display: none; }
  #abrir-menu { display: grid; }
  .marca { font-size: 19px; gap: 4px; }
  .marco { margin: 0 8px 8px; border-radius: 20px; }
  #zona { padding: 0 16px; }
  #pie { padding: 8px 12px calc(12px + env(safe-area-inset-bottom)); }
  .categorias { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 22px; }
  .cat { display: flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 9px; }
  .cat .ic { width: 16px; height: 16px; margin: 0; }
  .cat b { font-size: 13px; font-weight: 500; }
  .cat small { display: none; }
  .pie-columna { display: flex; flex-direction: column; }
  .marco.inicio .sugerencias { order: -1; margin: 0 0 10px; display: grid; grid-template-columns: 1fr 1fr; }
  .marco.inicio .sugerencias .sug:nth-child(n+3) { display: none; }
  .sug { padding: 9px 10px; text-align: left; }
  .sug svg { display: none; }
  .yo { max-width: 90%; }
  #estado { display: none; }
  #btn-vincular span { display: none; }
  #principal span { display: none; }
  #principal { width: 34px; padding: 0; justify-content: center; border-radius: 50%; }
}
</style>
</head>
<body>

<nav class="barra">
  <div class="marca">
    <button class="icono" id="abrir-menu" aria-label="Menú">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    Jarvis
  </div>
  <div class="centro">
    <button class="nav marcado" id="btn-nuevo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      Nuevo chat
    </button>
    <button class="nav" id="btn-buscar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Buscar chats
    </button>
    <button class="nav" id="btn-historial">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4H10a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4.5A1.5 1.5 0 0 1 3 16.5z"/><path d="M21 5.5A1.5 1.5 0 0 0 19.5 4H14a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
      Historial
    </button>
    <button class="nav" id="btn-tareas">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>
      Tareas
    </button>
  </div>
  <div class="derecha">
    <div id="estado">conectando…</div>
    <button class="nav marcado" id="btn-vincular" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>
      <span>Vincular celular</span>
    </button>
  </div>
</nav>

<div class="menu" id="menu-movil">
  <button data-accion="nuevo">Nuevo chat</button>
  <button data-accion="historial">Historial y búsqueda</button>
  <button data-accion="tareas">Tareas</button>
</div>

<main class="marco inicio" id="marco">
  <section id="zona">
    <div class="columna" id="bienvenida">
      <h1>Qué bueno verte<span id="saludo-nombre"></span></h1>
      <p>Jarvis, tu agente local para todo lo que pase en tu PC.</p>
      <div class="categorias">
        <button class="cat" data-enviar="cómo está el equipo">
          <svg class="ic c-azul" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          <b>Equipo</b><small>Estado, lentitud y modos de la gráfica</small>
        </button>
        <button class="cat" data-escribir="busca el archivo llamado ">
          <svg class="ic c-rojo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <b>Archivos</b><small>Buscar, leer, mover y ordenar</small>
        </button>
        <button class="cat" data-escribir="explícame según mis apuntes ">
          <svg class="ic c-naranja" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-1.5zM4 19.5A2 2 0 0 1 6 18h12"/></svg>
          <b>Estudio</b><small>Explica y repasa con tus apuntes</small>
        </button>
        <button class="cat" data-escribir="investiga ">

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const marco = $("#marco");
const conversacion = $("#conversacion");
const zona = $("#zona");
const entrada = $("#entrada");

function el(tag, clase, texto) {
  const e = document.createElement(tag);
  if (clase) e.className = clase;
  if (texto !== undefined) e.textContent = texto;
  return e;
}
function abajo() { zona.scrollTop = zona.scrollHeight; }
function modoChat() { marco.classList.remove("inicio"); }
function modoInicio() { marco.classList.add("inicio"); conversacion.replaceChildren(); }

async function api(ruta, opciones = {}) {
  const r = await fetch(ruta, {
    ...opciones,
    headers: { "Content-Type": "application/json", "X-Jarvis-Chat": "1", ...(opciones.headers || {}) },
    credentials: "same-origin",
  });
  if (r.status === 401) { location.href = "/chat"; throw new Error("sin vincular"); }
  if (!r.ok) throw new Error(`${r.status}`);
  return r.json();
}

function corto(obj) {
  try {
    const t = JSON.stringify(obj);
    return t === "{}" ? "" : (t.length > 220 ? t.slice(0, 220) + "…" : t);
  } catch { return ""; }
}

const ORIGEN = { router: "router", modelo: "modelo", semantica: "capa semántica", error: "error" };
const SVG_J = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg>';

function burbujaYo(texto) { conversacion.append(el("div", "yo", texto)); }
function cajaJarvis() {
  const fila = el("div", "jarvis");
  const m = el("div", "marca-j");
  m.innerHTML = SVG_J;
  const cuerpo = el("div", "cuerpo");
  fila.append(m, cuerpo);
  conversacion.append(fila);
  return cuerpo;
}

function nuevaRespuesta(texto) {
  modoChat();
  burbujaYo(texto);
  const caja = cajaJarvis();
  const pasos = el("details", "pasos");
  pasos.open = true;
  const resumen = el("summary", "", "Pasos");
  pasos.append(resumen);
  pasos.hidden = true;
  const pensando = el("div", "pensando");
  pensando.append(el("span", "punto"), el("span", "", "Pensando…"));
  caja.append(pasos, pensando);
  abajo();
  return { caja, pasos, resumen, pensando, nPasos: 0 };
}

function anotar(v, ev, hablarAhora) {
  if (ev.tipo === "log") {
    if (ev.clase === "ejecutando") {
      v.pensando.lastChild.textContent = ev.mensaje.replace("Ejecutando herramienta ", "Usando ").split(" con ")[0] + "…";
      return;
    }
    if (ev.clase === "info" && !/varios pasos|delegando|segundo plano|Presupuesto/i.test(ev.mensaje)) return;
    let texto = ev.mensaje;
    if (ev.clase === "ofrecidas") texto = texto.split(":")[0] + ".";
    if (ev.clase === "freno") {
      const m = texto.match(/^FRENO: (\w+)[^.]*\.\s*(?:No ejecuto \w+:\s*)?([^.]*)/);
      if (m) texto = `Frenado ${m[1]}: ${m[2]}.`;
    }
    v.pasos.hidden = false;
    v.pasos.append(el("div", "linea " + ev.clase, texto));
  } else if (ev.tipo === "paso") {
    v.nPasos++;
    v.pasos.hidden = false;
    const r = ev.resultado || "";
    const vetado = r.startsWith("No ejecuto") || r.startsWith("No usé");
    const fallo = r.includes("VERIFICACION FALLIDA");
    const p = el("div", "paso" + (vetado ? " vetado" : fallo ? " fallo" : ""));
    const cab = el("div");
    cab.append(el("span", "nombre", ev.herramienta));
    if (vetado) cab.append(el("span", "etiqueta freno", "frenado"));
    else if (fallo) cab.append(el("span", "etiqueta no", "no se comprobó"));
    p.append(cab);
    const args = corto(ev.argumentos);
    if (args) p.append(el("div", "args", args));
    p.append(el("div", "res", r.replace(/\nVERIFICACION FALLIDA:[\s\S]*/, "\nLa comprobación falló.")));
    v.pasos.append(p);
    v.resumen.textContent = `Pasos (${v.nPasos})`;
    v.pensando.lastChild.textContent = "Pensando…";
  } else if (ev.tipo === "respuesta" || ev.tipo === "error") {
    v.pensando.remove();
    v.caja.append(el("div", "respuesta" + (ev.tipo === "error" ? " error" : ""), ev.texto));
    if (ev.tipo === "respuesta") {
      v.caja.append(el("div", "meta", `${ORIGEN[ev.origen] || ev.origen} · ${(ev.ms / 1000).toFixed(1)} s`));
      if (v.nPasos === 0 && v.pasos.childElementCount <= 1) v.pasos.remove();
      else v.pasos.open = false;
      if (ev.confirmacion) confirmar(v.caja, ev.confirmacion);
      if ((vozAlta || hablarAhora) && vozInfo.hablar) decir(ev.texto);
    }
  } else if (ev.tipo === "fondo") {
    const f = el("div", "fondo");
    f.dataset.desc = ev.descripcion;
    const linea = el("div", "pensando");
    linea.append(el("span", "punto"), el("span", "", `Sigue al fondo: ${ev.descripcion}`));
    f.append(linea);
    v.caja.append(f);
  } else if (ev.tipo === "fondo_hecho") {
    const f = [...v.caja.querySelectorAll(".fondo")].find((x) => x.dataset.desc === ev.descripcion);
    const destino = f || v.caja.appendChild(el("div", "fondo"));
    destino.replaceChildren(el("div", "meta", `Terminó: ${ev.descripcion}`), el("div", "res", ev.resultado));
  }
  abajo();
}

function confirmar(caja, c) {
  const box = el("div", "confirmar");
  box.append(el("div", "q", `¿Confirmas que quieres ${c.descripcion}?`));
  const si = el("button", "si", "Sí, hazlo");
  const no = el("button", "no", "No");
  const cuenta = el("span", "cuenta");
  box.append(si, no, cuenta);
  caja.append(box);
  let quedan = Math.max(0, Math.floor(c.segundos));
  const tic = () => {
    cuenta.textContent = `${quedan} s`;
    if (quedan-- <= 0) { clearInterval(reloj); box.replaceChildren(el("div", "meta", "La confirmación caducó.")); }
  };
  const reloj = setInterval(tic, 1000);
  tic();
  const responder = (t) => { clearInterval(reloj); box.remove(); mandar(t); };
  si.onclick = () => responder("sí");
  no.onclick = () => responder("no");
}

let ocupados = 0;
async function mandar(texto, hablarAhora = false) {
  texto = (texto || "").trim();
  if (!texto) return;
  const v = nuevaRespuesta(texto);
  ocupados++;
  try {
    const { id } = await api("/chat/orden", { method: "POST", body: JSON.stringify({ texto }) });
    let desde = 0, terminado = false, fallosRed = 0;
    while (!terminado) {
      try {
        const r = await api(`/chat/eventos/${id}?desde=${desde}`);
        fallosRed = 0;
        for (const ev of r.eventos) anotar(v, ev, hablarAhora);
        desde = r.siguiente;
        terminado = r.terminado;
      } catch (e) {
        if (++fallosRed > 8) throw e;
        await new Promise((ok) => setTimeout(ok, 1500));
      }
    }
  } catch (e) {
    v.pensando.remove();
    v.caja.append(el("div", "respuesta error", `No pude hablar con Jarvis (${e.message}). ¿Está encendido?`));
  } finally {
    ocupados--;
    refrescarEstado();
  }
}

/* ---------- El boton morado: "Hablar" con la caja vacia, "Enviar" con texto ---------- */
const ICONO_HABLAR = '<path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/>';
const ICONO_ENVIAR = '<path d="M5 12h14M13 6l6 6-6 6"/>';
function actualizarPrincipal() {
  const hayTexto = entrada.value.trim().length > 0;
  const puedeHablar = microfonoPosible() && !hayTexto;
  const hablando = !!grabadora && grabadora.modo === "hablar";
  $("#txt-principal").textContent = hablando ? "Parar" : (puedeHablar ? "Hablar" : "Enviar");
  $("#ic-principal").innerHTML = (puedeHablar || hablando) ? ICONO_HABLAR : ICONO_ENVIAR;
  $("#principal").classList.toggle("grabando", hablando);
  $("#principal").disabled = !hayTexto && !puedeHablar && !grabadora;
}

$("#formulario").onsubmit = (e) => {
  e.preventDefault();
  if (grabadora) { grabadora.parar(); return; }
  const t = entrada.value;
  if (!t.trim()) { if (microfonoPosible()) empezarAGrabar("hablar"); return; }
  entrada.value = "";
  ajustar();
  mandar(t);
};
entrada.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    if (entrada.value.trim()) $("#formulario").requestSubmit();
  }
});
function ajustar() {
  entrada.style.height = "auto";
  entrada.style.height = Math.min(Math.max(entrada.scrollHeight, 44), 180) + "px";
  actualizarPrincipal();
}
entrada.addEventListener("input", ajustar);

document.querySelectorAll("[data-enviar]").forEach((b) => (b.onclick = () => mandar(b.dataset.enviar)));
document.querySelectorAll("[data-escribir]").forEach((b) => (b.onclick = () => {
  entrada.value = b.dataset.escribir;
  ajustar();
  entrada.focus();
  entrada.setSelectionRange(entrada.value.length, entrada.value.length);
}));
$("#btn-ultimo").onclick = () => mandar("cómo quedó lo último");

$("#btn-ajustes").onclick = (e) => { e.stopPropagation(); $("#menu-ajustes").hidden = !$("#menu-ajustes").hidden; };
document.querySelectorAll("#menu-ajustes [data-orden]").forEach((b) => (b.onclick = () => {
  $("#menu-ajustes").hidden = true;
  mandar(b.dataset.orden);
}));
document.addEventListener("click", (e) => {
  if (!e.target.closest(".ancla")) $("#menu-ajustes").hidden = true;
  if (!e.target.closest("#menu-movil") && !e.target.closest("#abrir-menu")) $("#menu-movil").classList.remove("abierto");
});

/* ---------- Historial ---------- */
let historial = [];
let estadoActual = null;

function grupoDe(momento) {
  const d = new Date(momento);
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const dia = new Date(d); dia.setHours(0, 0, 0, 0);
  const n = Math.round((hoy - dia) / 86400000);
  if (n <= 0) return "Hoy";
  if (n === 1) return "Ayer";
  if (n < 7) return `Hace ${n} días`;
  if (n < 30) return "Últimos 30 días";
  return "Más antiguos";
}

function pintarHistorial() {
  const caja = $("#historial");
  caja.replaceChildren();
  const q = $("#buscar").value.trim().toLowerCase();
  const items = historial.filter((c) => !q || (c.texto + " " + (c.respuesta || "")).toLowerCase().includes(q))
                         .slice().reverse();
  if (!items.length) {
    caja.append(el("div", "lat-vacio", q ? "Nada coincide con la búsqueda." : "Aquí aparecerá lo que hables con Jarvis."));
    return;
  }
  let actual = null, grupo = null;
  for (const c of items) {
    const g = grupoDe(c.momento);
    if (g !== actual) {
      actual = g;
      grupo = el("div", "grupo");
      grupo.append(el("h3", "", g));
      caja.append(grupo);
    }
    const it = el("div", "item");
    it.append(el("span", "t", c.texto));
    const mas = el("button", "mas", "•••");
    mas.title = "Opciones";
    mas.onclick = (e) => { e.stopPropagation(); preguntarBorrar(it, c); };
    it.append(mas);
    it.onclick = () => abrirDelHistorial(c, it);
    grupo.append(it);
  }
}

function preguntarBorrar(it, c) {
  it.classList.add("borrar");
  it.onclick = null;
  const si = el("button", "si", "Borrar");
  const no = el("button", "", "Cancelar");
  it.replaceChildren(el("span", "t", "¿Borrar del historial?"), si, no);
  no.onclick = (e) => { e.stopPropagation(); pintarHistorial(); };
  si.onclick = async (e) => {
    e.stopPropagation();
    try { await api(`/chat/historial/${c.id}`, { method: "DELETE" }); } catch {}
    historial = historial.filter((x) => x.id !== c.id);
    pintarHistorial();
  };
}

function abrirDelHistorial(c, it) {
  document.querySelectorAll(".item.activo").forEach((x) => x.classList.remove("activo"));
  it.classList.add("activo");
  conversacion.replaceChildren();
  modoChat();
  const f = new Date(c.momento);
  conversacion.append(el("div", "fecha-sep", f.toLocaleString("es-CO", { dateStyle: "medium", timeStyle: "short" })));
  burbujaYo(c.texto);
  const caja = cajaJarvis();
  caja.append(el("div", "respuesta" + (c.origen === "error" ? " error" : ""), c.respuesta || ""));
  if (c.origen) caja.append(el("div", "meta", ORIGEN[c.origen] || c.origen));
  cerrarHistorial();
  abajo();
  entrada.focus();
}

function abrirHistorial(buscar = false) {
  pintarHistorial();
  $("#historial-panel").classList.add("abierto");
  $("#velo").classList.add("visible");
  if (buscar) setTimeout(() => $("#buscar").focus(), 120);
}
function cerrarHistorial() { $("#historial-panel").classList.remove("abierto"); $("#velo").classList.remove("visible"); }
$("#buscar").addEventListener("input", pintarHistorial);
$("#btn-historial").onclick = () => abrirHistorial(false);
$("#btn-buscar").onclick = () => abrirHistorial(true);
$("#cerrar-historial").onclick = cerrarHistorial;
$("#velo").onclick = cerrarHistorial;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarHistorial(); });

async function chatNuevo() {
  try { await api("/chat/nuevo", { method: "POST" }); } catch {}
  document.querySelectorAll(".item.activo").forEach((x) => x.classList.remove("activo"));
  modoInicio();
  cerrarHistorial();
  entrada.focus();
}
$("#btn-nuevo").onclick = chatNuevo;

$("#abrir-menu").onclick = (e) => { e.stopPropagation(); $("#menu-movil").classList.toggle("abierto"); };
document.querySelectorAll("#menu-movil [data-accion]").forEach((b) => (b.onclick = () => {
  $("#menu-movil").classList.remove("abierto");
  ({ nuevo: chatNuevo, historial: () => abrirHistorial(false), tareas: () => $("#btn-tareas").click() })[b.dataset.accion]();
}));

/* ---------- Estado ---------- */
async function refrescarEstado() {
  try {
    const s = await api("/chat/estado");
    estadoActual = s;
    $("#estado").classList.remove("sin");
    $("#estado").textContent = `${s.modo} · ${s.modelo.replace(/-instruct.*$/, "")}`;
    $("#estado").title = `Modo ${s.modo} con ${s.modelo}`;
    $("#btn-vincular").hidden = s.lugar !== "local";
    const saludo = $("#saludo-nombre");
    saludo.replaceChildren();
    if (s.nombre) saludo.append(", ", el("span", "nombre", s.nombre));
    vozInfo = s.voz || {};
    $("#btn-mic").hidden = !microfonoPosible();
    $("#btn-mic").title = vozInfo.atajo ? `Dictar (en el PC también con ${vozInfo.atajo})` : "Dictar";
    $("#btn-voz-alta").hidden = !vozInfo.hablar;
    $("#btn-voz-alta").classList.toggle("activo", vozAlta);
    actualizarPrincipal();
    const ids = historial.map((c) => c.id).join();
    historial = s.conversacion || [];
    if (historial.map((c) => c.id).join() !== ids && $("#historial-panel").classList.contains("abierto")) pintarHistorial();
  } catch {
    $("#estado").classList.add("sin");
    $("#estado").textContent = "sin conexión";
  }
}

function mostrarTareas() {
  const lista = $("#lista-tareas");
  lista.replaceChildren();
  const ts = (estadoActual && estadoActual.tareas) || [];
  if (!ts.length) lista.append(el("p", "", "Todavía no hay tareas."));
  const NOMBRES = { hecha: "hecha", fallo: "falló", corriendo: "en curso", interrumpida: "a medias", en_cola: "en cola" };
  for (const t of ts) {
    const d = el("div", "tarea");
    const cab = el("div", "cab");
    cab.append(el("span", "", t.descripcion), el("span", "est", `${NOMBRES[t.estado] || t.estado} · ${t.inicio.slice(11, 16)}`));
    d.append(cab);
    if (t.resultado) d.append(el("div", "txt", t.resultado));
    lista.append(d);
  }
}
$("#btn-tareas").onclick = async () => { await refrescarEstado(); mostrarTareas(); $("#dlg-tareas").showModal(); };

let relojCodigo = null;
$("#btn-vincular").onclick = async () => {
  try {
    const r = await api("/chat/codigo", { method: "POST" });
    $("#v-codigo").textContent = r.codigo;
    $("#v-direccion").textContent = r.direccion || "No encontré la IP de Tailscale. ¿Está abierto en el PC?";
    let quedan = r.segundos;
    clearInterval(relojCodigo);
    const tic = () => {
      const m = Math.floor(quedan / 60), s = quedan % 60;
      $("#v-cuenta").textContent = quedan > 0 ? `Caduca en ${m}:${String(s).padStart(2, "0")}` : "Caducó. Ciérralo y pide otro.";
      if (quedan-- <= 0) clearInterval(relojCodigo);
    };
    tic(); relojCodigo = setInterval(tic, 1000);
    $("#dlg-vincular").showModal();
  } catch (e) {
    $("#v-direccion").textContent = "No pude pedir el código: " + e.message;
    $("#dlg-vincular").showModal();
  }
};
document.querySelectorAll("[data-cerrar]").forEach((b) => (b.onclick = () => b.closest("dialog").close()));

/* ---------- Voz: dictar, hablar y respuesta en voz alta ---------- */
let vozInfo = {};
let vozAlta = false;
try { vozAlta = localStorage.getItem("jarvis-voz-alta") === "1"; } catch {}
let audioActual = null;
let grabadora = null;

function microfonoPosible() {
  return !!(vozInfo.oir && window.isSecureContext && navigator.mediaDevices && window.MediaRecorder);
}
function avisoVoz(t) { $("#aviso-voz").textContent = t || ""; }

$("#btn-voz-alta").onclick = () => {
  vozAlta = !vozAlta;
  try { localStorage.setItem("jarvis-voz-alta", vozAlta ? "1" : "0"); } catch {}
  $("#btn-voz-alta").classList.toggle("activo", vozAlta);
  if (!vozAlta && audioActual) audioActual.pause();
  avisoVoz(vozAlta ? "Te contestaré en voz alta." : "");
  setTimeout(() => avisoVoz(""), 2500);
};

async function decir(texto) {
  try {
    if (audioActual) audioActual.pause();
    const r = await fetch("/chat/hablar", {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json", "X-Jarvis-Chat": "1" },
      body: JSON.stringify({ texto }),
    });
    if (!r.ok) return;
    audioActual = new Audio(URL.createObjectURL(await r.blob()));
    audioActual.play().catch(() => {});
  } catch {}
}

// "dictar": el texto queda en la caja para revisarlo.
// "hablar": se envia solo y la respuesta se dice en voz alta.
async function empezarAGrabar(modo) {
  if (audioActual) audioActual.pause();
  let flujo;
  try {
    flujo = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch {
    avisoVoz("El navegador no me deja usar el micrófono. Revisa el permiso del sitio.");
    return;
  }
  const trozos = [];
  const rec = new MediaRecorder(flujo);
  rec.ondataavailable = (e) => e.data.size && trozos.push(e.data);
  const ctx = new AudioContext();
  const analizador = ctx.createAnalyser();
  analizador.fftSize = 1024;
  ctx.createMediaStreamSource(flujo).connect(analizador);
  const datos = new Float32Array(analizador.fftSize);
  let hablo = 0, callado = 0, total = 0;
  const vigia = setInterval(() => {
    analizador.getFloatTimeDomainData(datos);
    let suma = 0; for (const x of datos) suma += x * x;
    const volumen = Math.sqrt(suma / datos.length);
    total += 0.1;
    if (volumen > 0.015) { hablo += 0.1; callado = 0; } else callado += 0.1;
    if ((hablo > 0.3 && callado > 1.3) || total > 20 || (hablo < 0.3 && total > 7)) parar();
  }, 100);
  function parar() { if (rec.state !== "inactive") rec.stop(); }
  rec.onstop = async () => {
    clearInterval(vigia);
    flujo.getTracks().forEach((t) => t.stop());
    ctx.close();
    grabadora = null;
    $("#btn-mic").classList.remove("grabando");
    actualizarPrincipal();
    if (hablo < 0.3) { avisoVoz("No te oí. Prueba otra vez."); return; }
    avisoVoz("Transcribiendo…");
    try {
      const blob = new Blob(trozos, { type: rec.mimeType || "audio/webm" });
      const r = await fetch("/chat/escuchar", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": blob.type, "X-Jarvis-Chat": "1" }, body: blob,
      });
      if (!r.ok) throw new Error(r.status);
      const { texto } = await r.json();
      avisoVoz("");
      if (!texto) { avisoVoz("No te entendí. Prueba otra vez."); return; }
      if (modo === "hablar") mandar(texto, true);
      else { entrada.value = (entrada.value ? entrada.value + " " : "") + texto; ajustar(); entrada.focus(); }
    } catch (e) {
      avisoVoz("No pude transcribir (" + e.message + ").");
    }
  };
  rec.start(250);
  grabadora = { parar, modo };
  if (modo === "dictar") $("#btn-mic").classList.add("grabando");
  actualizarPrincipal();
  avisoVoz("Te escucho… cuando termines, haz una pausa.");
}

$("#btn-mic").onclick = () => { if (grabadora) grabadora.parar(); else empezarAGrabar("dictar"); };

(async () => {
  await refrescarEstado();
  ajustar();
  entrada.focus();
  setInterval(() => { if (!ocupados) refrescarEstado(); }, 30000);
})();
